<!-- The icon a phone puts on its home screen, drawn from favicon.svg. The phone
     rounds the corners itself and paints anything transparent black, so the
     paper runs to the edges and has no outline of its own. What is served is
     the picture of this at src/litmark/api/apple-touch-icon.png: see TOUCH_ICON
     in src/litmark/api/login.py for how to draw it again after a change here. -->
